name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a full commit SHA (the trailing comment is the tag it was pinned from), so a moved or
# hijacked tag cannot change what runs here. Dependabot proposes the next SHA as a pull request.
jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (API, core, web, e2e)
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Tests, with coverage floors
        run: pnpm test:coverage
      - name: Build API and isolated export worker
        if: matrix.node == 24
        run: pnpm --filter @clause/api build
      - name: Verify local durable Workflow and export worker
        if: matrix.node == 24
        run: node scripts/workflow-smoke.ts
      - name: Build web app
        run: pnpm --filter @clause/web build

  telemetry:
    name: OTLP collector delivery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download pinned official collector
        run: |
          curl --fail --location --retry 3 https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v0.163.1/otelcol_0.163.1_linux_amd64.tar.gz --output /tmp/otelcol.tar.gz
          echo "13e8983077dbfcd2fda38e842262b6bf7539b9310f48d981239989f78264445c  /tmp/otelcol.tar.gz" | sha256sum --check
          mkdir /tmp/otelcol
          tar -xzf /tmp/otelcol.tar.gz -C /tmp/otelcol
      - name: Verify real metric export and sensitive label exclusion
        run: |
          /tmp/otelcol/otelcol --config ops/otel-collector.yaml > /tmp/otel-capture.log 2>&1 &
          collector_pid=$!
          trap 'kill "$collector_pid"' EXIT
          OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318 CLAUSE_OTEL_CAPTURE=/tmp/otel-capture.log node scripts/telemetry-smoke.ts

  # The same suite, run against a real Postgres: this is the backend the hosted deployment uses.
  test-postgres:
    name: Postgres 16
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d # 16, multi-arch index
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLAUSE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tests against Postgres, with the Postgres store's coverage floor
        run: pnpm test:coverage

  # Real browser, real stack (in-memory API + the built web app), desktop and 390px, with axe on every journey.
  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: "true"
      - name: Keep the report when a journey fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Known-vulnerable production dependencies. One moderate advisory is accepted (see NOTES.md): sprintf-js via mammoth's
  # command-line path, which this service never calls, and no patched version exists.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
