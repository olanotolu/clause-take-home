version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A release has to be at least a week old before Dependabot proposes it (zizmor asks for 7); pnpm separately refuses anything under 3 days at install time.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
